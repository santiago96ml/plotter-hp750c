name: Plotter HP750C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q plotter server.py tests
      - name: Run raster tests
        run: python tests/test_raster.py
      - name: Run MCP stdio smoke test
        run: python tests/test_mcp.py
